apiVersion: v1
kind: Pod
metadata:
  name: mongobooks-db
  labels:
    app: mongobooks
    service: db
    vers: v1
spec:
  containers:
  - name: mongobooks-db
    image: mongo:8.2.2-noble
    env:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: "admin"
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: "password"
    volumeMounts:
    - mountPath: /data/db
      name: mongodb-data
  volumes:
  - name: mongodb-data
    emptyDir: {}
